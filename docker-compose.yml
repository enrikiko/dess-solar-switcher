# Canonical Docker Compose entry point. These values deliberately override any
# stale values in .env from older revisions of the scheduler.
services:
  dess-solar-switcher:
    build: .
    restart: unless-stopped
    user: "0:0"
    env_file: .env
    environment:
      DAYLIGHT_VALUE: "12336"
      NIGHT_VALUE: "12338"
    volumes:
      - ./data:/data

  dess-solar-dashboard:
    build: .
    restart: unless-stopped
    user: "0:0"
    env_file: .env
    environment:
      DAYLIGHT_VALUE: "12336"
      NIGHT_VALUE: "12338"
    command: [ "python", "web.py" ]
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
